# /etc/nginx/sites-available/w.controleonline.com.conf — TLS added by certbot.
server {
    server_name w.controleonline.com;
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    error_log /var/log/nginx/w.controleonline.com_error.log;
    access_log /var/log/nginx/w.controleonline.com_access.log;
    listen 80;
    listen [::]:80;
}
